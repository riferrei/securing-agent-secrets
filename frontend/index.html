<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Securing Agent Secrets</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="chat-pane">
        <header class="topbar">
          <div>
            <p class="eyebrow">Securing Agent Secrets</p>
            <h1>Customer Data Assistant</h1>
          </div>
          <div class="stage-tag">Controlling the Blast Radius</div>
        </header>

        <div id="messages" class="messages" aria-live="polite"></div>

        <form id="chatForm" class="composer">
          <input
            id="messageInput"
            autocomplete="off"
            placeholder="Ask about a customer, e.g. &quot;look up customer 1&quot;…"
            required
          />
          <button id="sendButton" type="submit">Send</button>
        </form>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
